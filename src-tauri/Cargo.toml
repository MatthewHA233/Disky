[package]
name = "disky"
version = "0.1.6"
edition = "2021"

[lib]
name = "disky_lib"
crate-type = ["rlib"]

[[bin]]
name = "disky"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
uuid = { version = "1", features = ["v4"] }
trash = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
bincode = "1"
sysinfo = "0.30"
rayon = "1"
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
futures = "0.3"
notify = "6"
png = "0.17"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
